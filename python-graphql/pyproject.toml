[project]
name = "cero-graphql"
version = "1.0.0"
description = "The Cero API as GraphQL, on Strawberry."
requires-python = ">=3.13"
dependencies = [
    "cero-core",
    "cero-mongodb",
    "cero-postgres",
    "graphql-core>=3.3.0",
    "pydantic-settings>=2.15.0",
    "starlette>=1.7.0",
    "strawberry-graphql[asgi]>=0.331.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cero-graphql = "cero_graphql.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
cero-core = { workspace = true }
cero-mongodb = { workspace = true }
cero-postgres = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
