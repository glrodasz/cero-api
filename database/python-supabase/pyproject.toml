[project]
name = "cero-supabase"
version = "1.0.0"
description = "Supabase storage for cero-core, built on supabase-py: every query is an HTTP request to PostgREST."
requires-python = ">=3.13"
dependencies = [
    "cero-core",
    "httpx>=0.28.1",
    "postgrest>=2.32.0",
    "supabase>=2.32.0",
]

[dependency-groups]
dev = ["cero-core[testing]"]

[tool.uv.sources]
cero-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
