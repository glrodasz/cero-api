[project]
name = "cero-postgres"
version = "1.0.0"
description = "Postgres storage for cero-core, built on SQLAlchemy 2 (async) and asyncpg, migrated with Alembic."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "cero-core",
    "sqlalchemy[asyncio]>=2.1.3",
]

[dependency-groups]
dev = ["cero-core[testing]"]

[tool.uv.sources]
cero-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
