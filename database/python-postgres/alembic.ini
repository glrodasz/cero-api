# Alembic configuration. The database URL is not here: migrations/env.py reads
# DATABASE_URL, like the apps do.
#
#   uv run alembic upgrade head          # create or update the tables
#   uv run alembic upgrade head --sql    # print the SQL instead
#   uv run alembic check                 # the models in records.py match the migrations

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
