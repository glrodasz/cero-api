# Cargo workspace for the Rust implementations: one lockfile and one `target/`
# for the core, the Postgres adapter and both frameworks.
#
#   cargo test --workspace          # everything (Postgres tests need `docker compose up -d postgres`)
#   cd rust-axum && cargo run       # one app
[workspace]
resolver = "3"
members = [
    "shared/rust-core",
    "database/rust-postgres",
    "rust-axum",
    "rust-actix",
]

[workspace.package]
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

# Versions shared by every member; members opt into the features they need.
[workspace.dependencies]
cero-core = { path = "shared/rust-core" }
cero-postgres = { path = "database/rust-postgres" }

actix-cors = "0.7.2"
actix-http = { version = "3.18.12", default-features = false }
actix-web = { version = "4.15.0", default-features = false, features = ["macros"] }
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "uuid"] }
thiserror = "2.0.21"
tokio = "1.53.2"
tower = "0.5.3"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.27.0", features = ["v4"] }
