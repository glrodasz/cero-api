<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 576" width="880" role="img">
  <title>Cero API layers</title>
  <desc>A client calls a framework's transport layer, which calls the language core's services; storage adapters implement the core's repository ports.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
  </defs>
  <g class="s-gray"><rect x="330" y="30" width="220" height="56" rx="8"/>
    <text class="th" x="440" y="50" text-anchor="middle" dominant-baseline="central">Client</text>
    <text class="ts" x="440" y="68" text-anchor="middle" dominant-baseline="central">HTTP or GraphQL</text></g>
  <g class="ct-purple"><rect x="30" y="116" width="820" height="120" rx="16"/>
    <text class="th" x="52" y="138" dominant-baseline="central">Transport</text>
    <text class="ts" x="52" y="156" dominant-baseline="central">&lt;language&gt;-&lt;framework&gt;/</text></g>
  <g class="n-purple"><rect x="42" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="134" y="191" text-anchor="middle" dominant-baseline="central">TypeScript</text>
    <text class="ts" x="134" y="209" text-anchor="middle" dominant-baseline="central">express, fastify, nest, …</text></g>
  <g class="n-purple"><rect x="246" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="338" y="191" text-anchor="middle" dominant-baseline="central">Python</text>
    <text class="ts" x="338" y="209" text-anchor="middle" dominant-baseline="central">fastapi, graphql, …</text></g>
  <g class="n-purple"><rect x="450" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="542" y="191" text-anchor="middle" dominant-baseline="central">Go</text>
    <text class="ts" x="542" y="209" text-anchor="middle" dominant-baseline="central">gin, fiber</text></g>
  <g class="n-purple"><rect x="654" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="746" y="191" text-anchor="middle" dominant-baseline="central">Rust</text>
    <text class="ts" x="746" y="209" text-anchor="middle" dominant-baseline="central">axum, actix</text></g>
  <g class="ct-blue"><rect x="30" y="276" width="820" height="120" rx="16"/>
    <text class="th" x="52" y="298" dominant-baseline="central">Core</text>
    <text class="ts" x="52" y="316" dominant-baseline="central">shared/&lt;language&gt;-core/</text></g>
  <g class="n-blue"><rect x="42" y="334" width="184" height="50" rx="8"/>
    <text class="tm" x="134" y="351" text-anchor="middle" dominant-baseline="central">TasksService</text>
    <text class="ts" x="134" y="369" text-anchor="middle" dominant-baseline="central">task rules</text></g>
  <g class="n-blue"><rect x="246" y="334" width="184" height="50" rx="8"/>
    <text class="tm" x="338" y="351" text-anchor="middle" dominant-baseline="central">FocusSessionsService</text>
    <text class="ts" x="338" y="369" text-anchor="middle" dominant-baseline="central">pauses and finishing</text></g>
  <g class="n-blue"><rect x="450" y="334" width="184" height="50" rx="8"/>
    <text class="th" x="542" y="351" text-anchor="middle" dominant-baseline="central">Repository ports</text>
    <text class="ts" x="542" y="369" text-anchor="middle" dominant-baseline="central">storage interfaces</text></g>
  <g class="n-blue"><rect x="654" y="334" width="184" height="50" rx="8"/>
    <text class="th" x="746" y="351" text-anchor="middle" dominant-baseline="central">In-memory adapter</text>
    <text class="ts" x="746" y="369" text-anchor="middle" dominant-baseline="central">STORAGE=memory</text></g>
  <g class="ct-teal"><rect x="30" y="436" width="820" height="120" rx="16"/>
    <text class="th" x="52" y="458" dominant-baseline="central">Storage</text>
    <text class="ts" x="52" y="476" dominant-baseline="central">database/&lt;language&gt;-&lt;db&gt;/</text></g>
  <g class="n-teal"><rect x="42" y="494" width="184" height="50" rx="8"/>
    <text class="th" x="134" y="511" text-anchor="middle" dominant-baseline="central">MongoDB</text>
    <text class="ts" x="134" y="529" text-anchor="middle" dominant-baseline="central">Mongoose, PyMongo</text></g>
  <g class="n-teal"><rect x="246" y="494" width="184" height="50" rx="8"/>
    <text class="th" x="338" y="511" text-anchor="middle" dominant-baseline="central">Postgres</text>
    <text class="ts" x="338" y="529" text-anchor="middle" dominant-baseline="central">pgx, sqlx, SQLAlchemy</text></g>
  <g class="n-teal"><rect x="450" y="494" width="184" height="50" rx="8"/>
    <text class="th" x="542" y="511" text-anchor="middle" dominant-baseline="central">Firestore</text>
    <text class="ts" x="542" y="529" text-anchor="middle" dominant-baseline="central">TypeScript and Python</text></g>
  <g class="n-teal"><rect x="654" y="494" width="184" height="50" rx="8"/>
    <text class="th" x="746" y="511" text-anchor="middle" dominant-baseline="central">Supabase</text>
    <text class="ts" x="746" y="529" text-anchor="middle" dominant-baseline="central">supabase-js, supabase-py</text></g>
  <path class="arr" d="M440 86 V116" marker-end="url(#a)"/>
  <text class="ts" x="452" y="101" dominant-baseline="central">calls routes</text>
  <path class="arr" d="M440 236 V276" marker-end="url(#a)"/>
  <text class="ts" x="452" y="256" dominant-baseline="central">calls services</text>
  <path class="arr" d="M440 436 V396" marker-end="url(#a)"/>
  <text class="ts" x="452" y="416" dominant-baseline="central">implements the ports</text>
</svg>
