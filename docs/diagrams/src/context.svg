<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" role="img">
  <title>Cero API system context</title>
  <desc>A developer runs the contract suite and a RETO client calls REST or GraphQL against Cero API, whose sixteen implementations store tasks and focus sessions in MongoDB, PostgreSQL, Firebase or Supabase.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
    <marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
  </defs>

  <g class="s-gray"><rect x="170" y="30" width="220" height="56" rx="28"/>
    <text class="th" x="280" y="50" text-anchor="middle" dominant-baseline="central">Developer</text>
    <text class="ts" x="280" y="68" text-anchor="middle" dominant-baseline="central">Compares the stacks</text></g>
  <g class="s-gray"><rect x="490" y="30" width="220" height="56" rx="8"/>
    <text class="th" x="600" y="50" text-anchor="middle" dominant-baseline="central">RETO client</text>
    <text class="ts" x="600" y="68" text-anchor="middle" dominant-baseline="central">Tasks and focus sessions</text></g>

  <path class="arr" d="M280 86 V150" marker-end="url(#a)"/>
  <text class="ts" x="290" y="118" dominant-baseline="central">runs contract suite</text>
  <path class="arr" d="M600 86 V150" marker-end="url(#a)"/>
  <text class="ts" x="610" y="118" dominant-baseline="central">calls REST or GraphQL</text>

  <g class="s-purple"><rect x="230" y="150" width="420" height="80" rx="8"/>
    <text class="th" x="440" y="180" text-anchor="middle" dominant-baseline="central">Cero API</text>
    <text class="ts" x="440" y="202" text-anchor="middle" dominant-baseline="central">16 implementations, one API contract</text></g>

  <path class="arr" d="M440 230 V262"/>
  <text class="ts" x="452" y="246" dominant-baseline="central">stores tasks and sessions</text>
  <path class="arr" d="M125 262 H755"/>
  <path class="arr" d="M125 262 V300" marker-end="url(#a)"/>
  <path class="arr" d="M335 262 V300" marker-end="url(#a)"/>
  <path class="arr" d="M545 262 V300" marker-end="url(#a)"/>
  <path class="arr" d="M755 262 V300" marker-end="url(#a)"/>

  <g class="s-teal"><rect x="30" y="300" width="190" height="56" rx="8"/>
    <text class="th" x="125" y="320" text-anchor="middle" dominant-baseline="central">MongoDB</text>
    <text class="ts" x="125" y="338" text-anchor="middle" dominant-baseline="central">Used by 6 stacks</text></g>
  <g class="s-teal"><rect x="240" y="300" width="190" height="56" rx="8"/>
    <text class="th" x="335" y="320" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
    <text class="ts" x="335" y="338" text-anchor="middle" dominant-baseline="central">Used by 8 stacks</text></g>
  <g class="s-gray"><rect x="450" y="300" width="190" height="56" rx="8"/>
    <text class="th" x="545" y="320" text-anchor="middle" dominant-baseline="central">Firebase</text>
    <text class="ts" x="545" y="338" text-anchor="middle" dominant-baseline="central">Functions, Firestore</text></g>
  <g class="s-gray"><rect x="660" y="300" width="190" height="56" rx="8"/>
    <text class="th" x="755" y="320" text-anchor="middle" dominant-baseline="central">Supabase</text>
    <text class="ts" x="755" y="338" text-anchor="middle" dominant-baseline="central">Postgres, Edge Functions</text></g>
</svg>
