  <g class="n-purple"><rect x="246" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="338" y="191" text-anchor="middle" dominant-baseline="central">Python</text>
    <text class="ts" x="338" y="209" text-anchor="middle" dominant-baseline="central">fastapi, graphql, …</text></g>
  <g class="n-purple"><rect x="450" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="542" y="191" text-anchor="middle" dominant-baseline="central">Go</text>
    <text class="ts" x="542" y="209" text-anchor="middle" dominant-baseline="central">gin, fiber</text></g>
  <g class="n-purple"><rect x="654" y="174" width="184" height="50" rx="8"/>
    <text class="th" x="746" y="191" text-anchor="middle" dominant-baseline="central">Rust</text>
