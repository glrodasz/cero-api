  </defs>
  <g class="s-gray"><rect x="330" y="30" width="220" height="56" rx="8"/>
    <text class="th" x="440" y="50" text-anchor="middle" dominant-baseline="central">Client</text>
    <text class="ts" x="440" y="68" text-anchor="middle" dominant-baseline="central">HTTP or GraphQL</text></g>
  <g class="ct-purple"><rect x="30" y="116" width="820" height="120" rx="16"/>
    <text class="th" x="52" y="138" dominant-baseline="central">Transport</text>
