[package]
name = "cero-core"
version = "1.0.0"
description = "Domain, business rules and repository ports of the Cero API, independent of any framework or database."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The repository contract and a manual clock, for tests (the core's and every storage adapter's).
testing = []

[dependencies]
async-trait.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
# The core's own tests use its `testing` feature too.
cero-core = { path = ".", features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
