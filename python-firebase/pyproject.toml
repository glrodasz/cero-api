[project]
name = "cero-firebase"
version = "1.0.0"
description = "The Cero API as a Cloud Function for Firebase: python-fastapi's app, storing data in Firestore."
requires-python = ">=3.13"
dependencies = [
    "a2wsgi>=1.10.10",
    "cero-fastapi",
    "cero-firestore",
    "fastapi>=0.142.2",
    "firebase-functions>=0.6.0",
    "flask>=3.1.3",
    "starlette>=1.7.0",
]

[dependency-groups]
dev = [
    "google-cloud-firestore>=2.34.0",
    "pytest>=9.1.1",
    "werkzeug>=3.1.9",
]

[tool.uv.sources]
cero-fastapi = { workspace = true }
cero-firestore = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"
